<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>Pick Screen Color</title>
	<style>
		html, body {
			margin: 0;
			padding: 0;
			overflow: hidden;
			background: #000;
			cursor: crosshair;
			user-select: none;
			-webkit-user-select: none;
		}
		#screen {
			position: fixed;
			inset: 0;
			width: 100%;
			height: 100%;
			display: block;
		}
		#hint {
			position: fixed;
			left: 50%;
			top: 14px;
			transform: translateX(-50%);
			font: 12px system-ui, sans-serif;
			color: #fff;
			background: rgba(0, 0, 0, 0.6);
			padding: 5px 12px;
			border-radius: 4px;
			pointer-events: none;
			white-space: nowrap;
		}
	</style>
</head>
<body>
	<canvas id="screen"></canvas>
	<div id="hint"></div>
	<script>
		// Screen color picker overlay (feedback #382).
		// The main process captures every display up front; this page shows the
		// frozen screenshot full screen, draws a magnifier under the cursor and
		// reports the sampled pixel back. It never touches the live desktop,
		// so it works with GPU-composited content where the old native picker
		// only showed a black overlay.
		const { ipcRenderer } = require('electron');

		const canvas = document.getElementById('screen');
		const ctx = canvas.getContext('2d', { willReadFrequently: true });
		const hint = document.getElementById('hint');

		/** @type {HTMLImageElement} */
		let image = null;
		/** physical image pixels per CSS pixel */
		let image_scale = 1;
		/** cursor position in CSS pixels, null when outside the window */
		let cursor = null;
		let finished = false;
		/** offscreen copy used for exact pixel sampling */
		const sample_canvas = document.createElement('canvas');
		const sample_ctx = sample_canvas.getContext('2d', { willReadFrequently: true });

		const MAGNIFIER_RADIUS = 62;
		const MAGNIFIER_ZOOM = 9;

		function finish(color) {
			if (finished) return;
			finished = true;
			ipcRenderer.send('screen-color-picker-result', color || null);
		}

		function loadImage(data_url) {
			const img = new Image();
			img.onload = () => {
				image = img;
				canvas.width = img.width;
				canvas.height = img.height;
				sample_canvas.width = img.width;
				sample_canvas.height = img.height;
				sample_ctx.drawImage(img, 0, 0);
				image_scale = img.width / Math.max(1, window.innerWidth);
				hint.textContent = '点击取样 · 右键 / Esc 取消';
				render();
			};
			img.src = data_url;
		}

		function pixelAt(x, y) {
			if (!image) return null;
			x = Math.min(sample_canvas.width - 1, Math.max(0, Math.round(x)));
			y = Math.min(sample_canvas.height - 1, Math.max(0, Math.round(y)));
			const data = sample_ctx.getImageData(x, y, 1, 1).data;
			return { r: data[0], g: data[1], b: data[2], hex: '#' + [data[0], data[1], data[2]].map(value => value.toString(16).padStart(2, '0')).join('') };
		}

		function render() {
			if (!image) return;
			ctx.imageSmoothingEnabled = false;
			ctx.drawImage(image, 0, 0);

			if (!cursor) {
				return;
			}
			const scale = image_scale;
			const x = cursor.x * scale;
			const y = cursor.y * scale;
			const radius = MAGNIFIER_RADIUS * scale;
			const line = Math.max(1, scale);

			// crosshair across the whole screen
			ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
			ctx.lineWidth = line;
			ctx.beginPath();
			ctx.moveTo(x, 0);
			ctx.lineTo(x, canvas.height);
			ctx.moveTo(0, y);
			ctx.lineTo(canvas.width, y);
			ctx.stroke();

			// magnifier: magnified pixels inside a circle
			ctx.save();
			ctx.beginPath();
			ctx.arc(x, y, radius, 0, Math.PI * 2);
			ctx.clip();
			ctx.fillStyle = '#000';
			ctx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
			const source_size = (radius * 2) / MAGNIFIER_ZOOM;
			ctx.drawImage(image, x - source_size / 2, y - source_size / 2, source_size, source_size, x - radius, y - radius, radius * 2, radius * 2);
			// pixel grid
			const step = (radius * 2) / source_size;
			ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
			ctx.lineWidth = line;
			ctx.beginPath();
			for (let gx = 0; gx <= source_size; gx += 1) {
				ctx.moveTo(x - radius + gx * step, y - radius);
				ctx.lineTo(x - radius + gx * step, y + radius);
			}
			for (let gy = 0; gy <= source_size; gy += 1) {
				ctx.moveTo(x - radius, y - radius + gy * step);
				ctx.lineTo(x + radius, y - radius + gy * step);
			}
			ctx.stroke();
			ctx.restore();

			// ring + center marker
			ctx.strokeStyle = '#fff';
			ctx.lineWidth = 2 * line;
			ctx.beginPath();
			ctx.arc(x, y, radius, 0, Math.PI * 2);
			ctx.stroke();
			ctx.strokeStyle = '#000';
			ctx.lineWidth = line;
			ctx.beginPath();
			ctx.arc(x, y, radius + line, 0, Math.PI * 2);
			ctx.stroke();
			const marker = 4 * scale;
			ctx.strokeStyle = '#fff';
			ctx.lineWidth = line;
			ctx.strokeRect(x - marker, y - marker, marker * 2, marker * 2);

			// sampled color swatch + hex, kept inside the window
			const color = pixelAt(x, y);
			if (!color) return;
			const font_size = 13 * scale;
			ctx.font = '500 ' + font_size + 'px system-ui, sans-serif';
			const label = color.hex.toUpperCase();
			const text_width = ctx.measureText(label).width;
			const box_w = text_width + 34 * scale;
			const box_h = 24 * scale;
			let box_x = x + radius + 10 * scale;
			let box_y = y - box_h / 2;
			if (box_x + box_w > canvas.width - 8 * scale) box_x = x - radius - 10 * scale - box_w;
			if (box_x < 8 * scale) box_x = 8 * scale;
			if (box_y < 8 * scale) box_y = 8 * scale;
			if (box_y + box_h > canvas.height - 8 * scale) box_y = canvas.height - 8 * scale - box_h;
			ctx.fillStyle = 'rgba(0, 0, 0, 0.78)';
			ctx.fillRect(box_x, box_y, box_w, box_h);
			ctx.fillStyle = '#' + [color.r, color.g, color.b].map(value => value.toString(16).padStart(2, '0')).join('');
			ctx.fillRect(box_x + 5 * scale, box_y + 5 * scale, box_h - 10 * scale, box_h - 10 * scale);
			ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
			ctx.lineWidth = line;
			ctx.strokeRect(box_x + 5 * scale, box_y + 5 * scale, box_h - 10 * scale, box_h - 10 * scale);
			ctx.fillStyle = '#fff';
			ctx.textBaseline = 'middle';
			ctx.fillText(label, box_x + 5 * scale + box_h - 10 * scale + 7 * scale, box_y + box_h / 2 + scale);
		}

		ipcRenderer.on('screen-color-picker-image', (event, data_url) => {
			loadImage(data_url);
		});

		window.addEventListener('mousemove', event => {
			cursor = { x: event.clientX, y: event.clientY };
			render();
		});
		window.addEventListener('mouseleave', () => {
			cursor = null;
			render();
		});
		window.addEventListener('mousedown', event => {
			if (finished) return;
			if (event.button === 2) {
				finish(null);
				return;
			}
			if (event.button !== 0 || !image) return;
			const color = pixelAt(event.clientX * image_scale, event.clientY * image_scale);
			finish(color ? color.hex : null);
		});
		window.addEventListener('contextmenu', event => event.preventDefault());
		window.addEventListener('keydown', event => {
			if (event.key === 'Escape') finish(null);
		});
		window.addEventListener('resize', () => {
			if (!image) return;
			image_scale = image.width / Math.max(1, window.innerWidth);
			render();
		});
		window.addEventListener('blur', () => {
			// Losing focus means the user switched away; abort instead of trapping input.
			finish(null);
		});
	</script>
</body>
</html>
