name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  payload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed so annotated tag message is available for the changelog

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Build renderer bundles
        run: npm run build-electron

      # actions/checkout resolves the tag ref to a commit SHA and creates a local
      # lightweight ref, losing the annotated tag object. Re-fetch it so %(contents)
      # below yields the tag annotation (changelog), not the commit message.
      - name: Fetch annotated tag object
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - name: Extract changelog for this tag
        run: |
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > tag_notes.md
          if [ ! -s tag_notes.md ]; then echo "See release page." > tag_notes.md; fi

      - name: Build hot-update payload
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/build_payload.js \
            --version "$VERSION" \
            --changelog tag_notes.md \
            --url "https://github.com/TT432/blockbench/releases/download/${GITHUB_REF_NAME}/payload-${VERSION}.zip"

      - name: Create GitHub release with payload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file tag_notes.md \
            release-out/payload-*.zip release-out/update.json

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      # matches the local publish-windows script: the color-picker package breaks packaging
      - run: npm uninstall electron-color-picker

      - run: npm run build-electron

      - name: Build NSIS installers (x64 + arm64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --windows --publish=never

      - name: Build portable executable
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          node ./scripts/rename_portable.js
          npx electron-builder --windows portable --publish=never
          git checkout -- package.json

      - name: Upload installers to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          for ($i = 0; $i -lt 30; $i++) {
            gh release view $tag 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 20
          }
          gh release upload $tag (Get-ChildItem dist-electron/*.exe | ForEach-Object { $_.FullName }) --clobber
